<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <!-- Background -->
  <rect width="800" height="400" rx="16" fill="#1a1a2e"/>

  <!-- === XCODE HAMMER === -->
  <g transform="translate(160, 200)">
    <!-- Rounded square background -->
    <rect x="-70" y="-70" width="140" height="140" rx="32" fill="#2B7DE9"/>
    <!-- Hammer at -45deg angle -->
    <g transform="rotate(-45) translate(0, -35)">
      <!-- Handle -->
      <rect x="-5" y="5" width="10" height="65" rx="3" fill="#B0B0B0"/>
      <!-- Head -->
      <rect x="-30" y="-14" width="60" height="19" rx="4" fill="#D4D4D4" stroke="#A0A0A0" stroke-width="1"/>
    </g>
  </g>
  <text x="160" y="310" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#4FC3F7">Xcode</text>

  <!-- === LIGHTNING BOLTS connecting Xcode to Cache === -->
  <!-- Top bolt -->
  <polyline points="240,170 290,155 330,175 370,155 410,175 450,160 490,178 530,158 575,170"
    fill="none" stroke="#FFD600" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Middle bolt (thickest/brightest) -->
  <polyline points="240,200 285,185 325,210 375,185 415,210 455,190 505,210 545,190 575,200"
    fill="none" stroke="#FFD600" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Inner glow for middle bolt -->
  <polyline points="240,200 285,185 325,210 375,185 415,210 455,190 505,210 545,190 575,200"
    fill="none" stroke="#FFF176" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Bottom bolt -->
  <polyline points="240,230 295,245 335,225 380,245 420,225 465,240 510,222 555,240 575,230"
    fill="none" stroke="#FFD600" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>

  <!-- === CACHE DATABASE === -->
  <g transform="translate(640, 190)">
    <!-- Cylinder body -->
    <rect x="-60" y="-40" width="120" height="100" rx="4" fill="#43A047"/>
    <!-- Top ellipse -->
    <ellipse cx="0" cy="-40" rx="60" ry="20" fill="#66BB6A" stroke="#2E7D32" stroke-width="2"/>
    <!-- Bottom ellipse -->
    <ellipse cx="0" cy="60" rx="60" ry="20" fill="#388E3C" stroke="#2E7D32" stroke-width="2"/>
    <!-- Side strokes -->
    <line x1="-60" y1="-40" x2="-60" y2="60" stroke="#2E7D32" stroke-width="2"/>
    <line x1="60" y1="-40" x2="60" y2="60" stroke="#2E7D32" stroke-width="2"/>
    <!-- Middle divider ellipses -->
    <ellipse cx="0" cy="-5" rx="58" ry="14" fill="none" stroke="#2E7D32" stroke-width="1.2" opacity="0.5"/>
    <ellipse cx="0" cy="30" rx="58" ry="14" fill="none" stroke="#2E7D32" stroke-width="1.2" opacity="0.5"/>
    <!-- Label -->
    <text x="0" y="18" text-anchor="middle" font-family="'Courier New', monospace" font-size="22" font-weight="bold" fill="white" opacity="0.9">CACHE</text>
  </g>
  <text x="640" y="310" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#66BB6A">Cache DB</text>
</svg>
